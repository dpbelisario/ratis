global:
  scrape_interval: 5s
  scrape_timeout: 4s
  external_labels:
    lab: ozone-incident-lab

scrape_configs:
  - job_name: ozone-om
    metrics_path: /prom
    static_configs:
      - targets: ["om1:9874", "om2:9874", "om3:9874"]
  - job_name: ozone-scm
    metrics_path: /prom
    static_configs:
      - targets: ["scm1:9876", "scm2:9876", "scm3:9876"]
  - job_name: ozone-datanode
    metrics_path: /prom
    static_configs:
      - targets: ["datanode:9882"]
  - job_name: lab
    metrics_path: /metrics
    fallback_scrape_protocol: PrometheusText0.0.4
    static_configs:
      - targets: ["labmeta:9100"]
