# allocation stops finishing"; remove it to test the delete job alone (schedules/jobs-only.conf).
00:00 writer-on
01:00 job01
06:00 fault-on
10:00 job10
11:00 restart om-all
11:10 restart scm-leader
11:20 fault-off
